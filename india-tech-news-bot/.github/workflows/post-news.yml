name: India Tech Page Bot

on:
  schedule:
    # IST approx: 08:30, 12:30, 18:00, 21:30 daily
    # (UTC 03:00, 07:00, 12:30, 16:00) - adjust to taste
    - cron: "0 3,7 * * *"
    - cron: "30 12,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit state.json (dedup memory)

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          PAGE_HANDLE: ${{ vars.PAGE_HANDLE }}
          # optional reach trick: set repo variable to "true" to enable
          POST_LINK_AS_FIRST_COMMENT: ${{ vars.POST_LINK_AS_FIRST_COMMENT }}
        run: python bot.py

      - name: Persist state.json (dedup memory across runs)
        run: |
          if [ -f state.json ]; then
            git config user.name  "page-bot"
            git config user.email "page-bot@users.noreply.github.com"
            git add state.json
            git commit -m "chore: bot state update [skip ci]" || echo "no state changes"
            git push || echo "state push skipped (non-fatal)"
          else
            echo "no state.json produced (run may have skipped posting)"
          fi
