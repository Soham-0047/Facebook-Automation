name: Facebook News Bot

on:
  schedule:
    # Times are UTC. These land roughly at 8am, 12pm, 4pm, 8pm IST.
    # GitHub may delay scheduled runs by a few minutes under load -- that's normal.
    - cron: "30 2 * * *"
    - cron: "30 6 * * *"
    - cron: "30 10 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit posted_articles.json back

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot (single post, jittered)
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # optional -- leave the secret unset to skip this
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # optional -- second text provider + free image gen
        run: python fb_news_bot.py --once --jitter-seconds 600

      - name: Persist dedup history + logs back to the repo
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add posted_articles.json news_bot.log || true
          git diff --cached --quiet || git commit -m "chore: update posted articles log [skip ci]"
          git push || true