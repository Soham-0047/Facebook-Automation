name: Insights Tracker

on:
  schedule:
    # 16:00 and 23:45 IST daily (UTC 10:30, 18:15) - pulls engagement
    # a few hours after each post lands, when reactions have accumulated
    - cron: "30 10 * * *"
    - cron: "15 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commits state.json (post_stats + hour histogram)
  issues: write      # v5.8: alert issues can actually be created

concurrency:
  group: news-bot-insights
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull engagement stats (no posting)
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        # v5.8: a crashing insights pull must NEVER redden the job - flag an
        # issue instead (same green-but-alerted philosophy as post-news)
        run: |
          if python bot.py --insights; then
            echo "insights pull completed"
          else
            echo "::warning::insights bot exited non-zero - job stays green, flagging issue"
            echo "The --insights run crashed on $(date -u '+%Y-%m-%d %H:%M UTC') (exit $?). Check FB_PAGE_ACCESS_TOKEN / Graph API status." > .run_alert
          fi

      - name: Alert on bot-flagged errors (job stays green)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .run_alert ]; then
            TITLE="Insights run crashed - needs attention"
            OPEN=$(gh issue list --state open --search "in:title $TITLE" --json number --jq 'length' 2>/dev/null || echo 0)
            if [ "$OPEN" = "0" ]; then
              gh issue create --title "$TITLE" --body "$(cat .run_alert)" || true
            fi
            rm -f .run_alert
          else
            echo "no insights errors flagged"
          fi

      - name: Persist state.json (skip if unchanged)
        if: always()
        run: |
          if [ -f state.json ] && git status --porcelain state.json | grep -q .; then
            git config user.name  "page-bot"
            git config user.email "page-bot@users.noreply.github.com"
            git add state.json
            git commit -m "chore: insights update [skip ci]" || echo "commit skipped"
            git push || echo "state push skipped (non-fatal)"
          else
            echo "state.json unchanged or missing - nothing to commit"
          fi
