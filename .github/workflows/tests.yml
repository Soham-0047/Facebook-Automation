name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "state.json"
      - "sample_cards/**"
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: news-bot-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile bot.py

      - name: Offline self-test (checks + sample cards)
        run: python bot.py --self-test

      - name: LLM call-path mock tests (20 cases)
        run: python tests/test_llm_mock.py

      - name: Contrast-aware scrim tests
        run: python tests/test_scrim.py
